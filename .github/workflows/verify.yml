name: Engine source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-and-runtime:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Source distribution excludes original game data
        run: python3 tools/audit_source.py
      - name: Synthetic format and boundary tests
        run: python3 -m unittest discover -s Tests -v
      - name: Native engine self-tests without game files
        run: swift run yeonggeoljeon-engine --self-test
